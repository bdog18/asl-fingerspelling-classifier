# Descriptive model only
model:
  type: "CNN"
  input_shape: [200, 200, 3]
  num_classes: 28
  architecture:
    - layer: "Conv2D"
      filters: 32
      kernel_size: [3, 3]
      activation: "relu"
    - layer: "MaxPooling2D"
      pool_size: [2, 2]
    - layer: "Conv2D"
      filters: 64
      kernel_size: [3, 3]
      activation: "relu"
    - layer: "MaxPooling2D"
      pool_size: [2, 2]
    - layer: "Conv2D"
      filters: 128
      kernel_size: [3, 3]
      activation: "relu"
    - layer: "MaxPooling2D"
      pool_size: [2, 2]
    - layer: "Flatten"
    - layer: "Dense"
      units: 256
      activation: "relu"
    - layer: "Dropout"
      rate: 0.5
    - layer: "Dense"
      units: 28
      activation: "softmax"
model_path: "./models/initial_model.h5"