[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-fingerspelling-classifier"
version = "0.1.0"
description = "A deep learning model for American Sign Language fingerspelling recognition."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Brenden Runion", email = "brendenrunion@gmail.com"}
]
maintainers = [
    {name = "Brenden Runion", email = "brendenrunion@gmail.com"}
]
keywords = ["asl", "sign-language", "computer-vision", "deep-learning", "tensorflow", "cnn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.8"
dependencies = [
    "tensorflow>=2.16.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.1.0",
    "Pillow>=9.0.0",
    "pyyaml>=6.0",
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
    "keras-tuner>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]
experiment = [
    "wandb>=0.13.0",
    "tensorboard>=2.12.0",
    "streamlit>=1.20.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/bdog18/asl-fingerspelling-classifier"
Repository = "https://github.com/bdog18/asl-fingerspelling-classifier"
Documentation = "https://github.com/bdog18/asl-fingerspelling-classifier#readme"
"Bug Tracker" = "https://github.com/bdog18/asl-fingerspelling-classifier/issues"

[project.scripts]
asl-train = "asl_classifier.scripts.train:main"
asl-evaluate = "asl_classifier.scripts.evaluate:main"
asl-predict = "asl_classifier.scripts.predict:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asl_classifier = ["configs/*.yaml", "data/*.json"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers --disable-warnings --cov=src/asl_classifier"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "tensorflow.*",
    "keras.*",
    "sklearn.*",
    "matplotlib.*",
    "PIL.*",
]
ignore_missing_imports = true
